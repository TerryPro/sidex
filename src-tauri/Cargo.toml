[package]
name = "sidex"
version = "0.1.3"
description = "SideX - A fast, open-source code editor"
authors = ["Siden Technologies Inc"]
license = "MIT"
repository = "https://github.com/sidenai/sidex"
edition = "2021"
rust-version = "1.91.0"

[[bin]]
name = "SideX"
path = "src/main.rs"

[lib]
name = "sidex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [
  "protocol-asset",
  "tray-icon",
  "devtools",
] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
notify = { version = "7", features = ["macos_fsevent"] }
portable-pty = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
reqwest = { version = "0.12", features = [
  "rustls-tls",
  "blocking",
  "gzip",
  "deflate",
  "brotli",
] }

# Encoding
base64 = "0.22"

# Crypto
sha2 = "0.10"
dotenvy = "0.15"
md5 = "0.7"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = "0.4"

# Path utilities
glob = "0.3"
globset = "0.4"

# Search indexing
regex = "1"
memchr = "2"

# Process & terminal management
which = "6"

# Extension API helpers
trash = "5"

sidex-settings = { path = "../crates/sidex-settings" }
sidex-theme = { path = "../crates/sidex-theme" }

# SideX crates
sidex-workspace = { path = "../crates/sidex-workspace" }

# Internal crates
sidex-text = { path = "../crates/sidex-text" }
sidex-syntax = { path = "../crates/sidex-syntax" }
sidex-extensions = { path = "../crates/sidex-extensions" }
sidex-keymap = { path = "../crates/sidex-keymap" }
sidex-profiles = { path = "../crates/sidex-profiles" }
sidex-auth = { path = "../crates/sidex-auth" }
sidex-textmate = { path = "../crates/sidex-textmate" }

tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
urlencoding = "2.1.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
