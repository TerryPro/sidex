<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://sidex-asset.localhost; script-src 'unsafe-inline' https://sidex-asset.localhost;">
<link rel="stylesheet" href="__SIDEX_ASSET_BASE__/style.css">
<title>CSV</title>
</head>
<body>
<div class="app">
	<div class="toolbar">
		<button class="icon-btn" id="toggle-filters" title="显示/隐藏筛选行" aria-label="筛选">
			<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
				<path d="M2.5 3.5h11l-4.2 5v4l-2.6 1.2V8.5L2.5 3.5z"></path>
			</svg>
		</button>
		<button class="icon-btn" id="clear-sort" title="清除排序" aria-label="清除排序" disabled>
			<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
				<path d="M4 3.5v9M4 3.5L2 5.7M4 3.5l2 2.2M8.5 4.5h5M8.5 7.5h4M8.5 10.5h3"></path>
			</svg>
		</button>
		<span class="divider"></span>
		<div class="search">
			<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
			<input id="global-filter" type="text" placeholder="筛选所有列" spellcheck="false" autocomplete="off">
		</div>
		<div class="spacer"></div>
		<div class="meta" id="meta"></div>
	</div>
	<div class="grid-wrap">
		<table>
			<thead id="thead"></thead>
			<tbody id="tbody"></tbody>
		</table>
		<div class="empty" id="empty" hidden>没有匹配的数据</div>
	</div>
	<div class="statusbar">
		<span id="status"></span>
		<span class="save-hint" id="save-hint">已保存</span>
	</div>
</div>
<script>window.__SIDEX_DATA__ = __SIDEX_ROWS_JSON__;</script>
<script src="__SIDEX_ASSET_BASE__/app.js"></script>
</body>
</html>
