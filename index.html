<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SideX</title>
		<script>
			// VS Code globals — must be set before any module loads
			globalThis._VSCODE_FILE_ROOT = window.location.origin + '/src/';
			globalThis._VSCODE_NLS_LANGUAGE = localStorage.getItem('vscode.nls.locale') || 'en';
			globalThis._VSCODE_NLS_MESSAGES = [];

			globalThis.__SIDEX_TAURI__ = true;
			try {
				const ua = navigator.userAgent || '';
				const plat = navigator.platform || '';
				if (ua.includes('Mac') || plat.includes('Mac')) {
					globalThis.__SIDEX_ARCH__ = 'arm64';
					try {
						const gl = document.createElement('canvas').getContext('webgl');
						const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
						const renderer = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '';
						if (renderer && /Intel/i.test(renderer) && !/Apple/i.test(renderer)) {
							globalThis.__SIDEX_ARCH__ = 'x64';
						}
					} catch (_) {}
				} else {
					globalThis.__SIDEX_ARCH__ = 'x64';
				}
			} catch (_) {
				globalThis.__SIDEX_ARCH__ = 'x64';
			}
			globalThis._VSCODE_PACKAGE_JSON = { version: '1.110.0', name: 'sidex' };
			globalThis._VSCODE_PRODUCT_JSON = {
				nameShort: 'SideX',
				nameLong: 'SideX',
				applicationName: 'sidex',
				dataFolderName: '.sidex',
				urlProtocol: 'sidex',
				version: '1.110.0',
				commit: '',
				date: new Date().toISOString(),
				quality: 'stable',
				reportIssueUrl: 'https://github.com/sidenai/sidex/issues/new',
				licenseName: 'MIT',
				licenseUrl: 'https://github.com/sidenai/sidex/blob/main/LICENSE',
				extensionsGallery: {
					serviceUrl: 'https://marketplace.siden.ai/api/gallery',
					itemUrl: 'https://open-vsx.org/vscode/item',
					resourceUrlTemplate: 'https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}',
					controlUrl: '',
					nlsBaseUrl: 'https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/extension',
					publisherUrl: ''
				}
			};
		</script>
		<script>
			// Forward frontend errors to the Rust log so issues are visible in tauri dev output.
			(function () {
				function report(message) {
					try {
						var internals = window.__TAURI_INTERNALS__;
						if (internals && internals.invoke) {
							internals.invoke('log_frontend_error', { message: String(message) });
						}
					} catch (_) { /* ignore */ }
				}
				window.addEventListener('error', function (event) {
					var stack = event.error && event.error.stack ? '\n' + event.error.stack : '';
					report((event.message || 'error') + ' @ ' + (event.filename || '') + ':' + (event.lineno || 0) + ':' + (event.colno || 0) + stack);
				});
				window.addEventListener('unhandledrejection', function (event) {
					var reason = event.reason;
					report('Unhandled rejection: ' + (reason && reason.stack ? reason.stack : String(reason)));
				});
			})();
		</script>
		<script src="/builtin-extensions.js"></script>
		<script type="module" src="/src/main.ts" defer></script>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background-color: #111111;
				color: #c0c0c0;
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Fira Sans', 'Droid Sans',
					'Helvetica Neue', sans-serif;
				font-size: 13px;
			}
			#sidex-splash {
				position: fixed;
				inset: 0;
				z-index: 100000;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 14px;
				background-color: #111111;
				color: #9d9d9d;
				font-size: 12px;
				letter-spacing: 0.4px;
				pointer-events: none;
				/* 启动很快时（约 1s）压根看不到遮罩，避免闪一下 */
				opacity: 0;
				animation: sidex-splash-in 200ms ease-out 500ms forwards;
			}
			@keyframes sidex-splash-in {
				to { opacity: 1; }
			}
			#sidex-splash .sidex-splash-logo {
				font-size: 26px;
				font-weight: 600;
				color: #e6e6e6;
				letter-spacing: 1px;
			}
			#sidex-splash .sidex-splash-bar {
				width: 120px;
				height: 2px;
				background: rgba(255, 255, 255, 0.12);
				overflow: hidden;
				border-radius: 1px;
			}
			#sidex-splash .sidex-splash-bar::after {
				content: '';
				display: block;
				width: 40%;
				height: 100%;
				background: #4daafc;
				animation: sidex-splash-slide 1.1s ease-in-out infinite;
			}
			@keyframes sidex-splash-slide {
				0% { transform: translateX(-110%); }
				100% { transform: translateX(280%); }
			}
			#sidex-splash.sidex-splash-hide {
				animation: none;
				opacity: 0;
			}
		</style>
	</head>
	<body aria-label="">
		<div id="sidex-splash">
			<div class="sidex-splash-logo">SideX</div>
			<div class="sidex-splash-bar"></div>
			<div>正在启动…</div>
		</div>
	</body>
</html>
