<!DOCTYPE html>
<html>
<body>
<script>
window.addEventListener('message', (e) => {
  if (!e.data || e.data.cmd !== 'go') return;
  const ms = e.data.ms || 2000;
  const start = performance.now();
  const end = start + ms;
  while (performance.now() < end) { /* busy loop */ }
  parent.postMessage({ done: true, elapsed: performance.now() - start }, '*');
});
parent.postMessage({ ready: true }, '*');
</script>
</body>
</html>
